<div class="filter-container">
  <div class="flex gap-3 items-center">
    <!-- Champ de recherche -->
    <input
      type="text"
      [(ngModel)]="searchText"
      (ngModelChange)="onFilterChange()"
      placeholder="{{ this.placeholder }}"
      class="flex-1 px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none"
    />

    <div class="sort-dropdown" [class.is-open]="isSortMenuOpen">
      <button
        type="button"
        class="sort-trigger"
        [attr.aria-expanded]="isSortMenuOpen"
        (click)="toggleSortMenu($event)"
      >
        <span>{{ sortOrder === 'recent' ? this.mostRecent : this.oldest }}</span>
        <i class="fas fa-chevron-down" [class.rotate-180]="isSortMenuOpen"></i>
      </button>

      @if (isSortMenuOpen) {
      <div class="sort-menu" role="listbox">
        <button type="button" class="sort-option" (click)="selectSortOrder('recent')">
          {{ this.mostRecent }}
        </button>
        <button type="button" class="sort-option" (click)="selectSortOrder('oldest')">
          {{ this.oldest }}
        </button>
      </div>
      }
    </div>
  </div>
</div>
