<div class="filter-container">
  <div class="flex gap-3 items-center">
    <!-- Champ de recherche -->
    <input
      type="text"
      [(ngModel)]="searchText"
      (ngModelChange)="onFilterChange()"
      placeholder="Rechercher..."
      class="flex-1 px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none"
    />

    <!-- Select pour le tri -->
    <select
      [(ngModel)]="sortOrder"
      (ngModelChange)="onFilterChange()"
      class="px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none bg-white cursor-pointer"
    >
      <option value="recent">Plus récents</option>
      <option value="oldest">Plus anciens</option>
    </select>
  </div>
</div>
