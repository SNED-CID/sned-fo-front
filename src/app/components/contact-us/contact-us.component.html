<section class="bg-slate-50 py-12">
  <div class="max-w-3xl mx-auto px-4 sm:px-6 lg:px-8">

    <h1 class="text-2xl font-semibold text-slate-800 mb-8 text-center">
      {{ 'contact.title' | translate }}
    </h1>

    <form
      [formGroup]="contactForm"
      (ngSubmit)="onSubmit()"
      class="bg-white rounded-xl shadow-sm border border-slate-200 p-6 sm:p-8 space-y-6"
    >

      <!-- Nom -->
      <div>
        <label for="name" class="block text-sm font-medium text-slate-700 mb-1">
          {{ 'contact.fields.name.label' | translate }}
        </label>
        <input
          id="name"
          type="text"
          formControlName="name"
          [placeholder]="'contact.fields.name.placeholder' | translate"
          class="w-full border rounded-md px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-[var(--sned-orange)] focus:border-transparent"
          [ngClass]="{ 'border-red-500': isInvalid('name') }"
        />
        <p *ngIf="isInvalid('name')" class="text-red-500 text-xs mt-1">
          {{ 'contact.fields.name.error' | translate }}
        </p>
      </div>

      <!-- Email -->
      <div>
        <label for="email" class="block text-sm font-medium text-slate-700 mb-1">
          {{ 'contact.fields.email.label' | translate }}
        </label>
        <input
          id="email"
          type="email"
          formControlName="email"
          [placeholder]="'contact.fields.email.placeholder' | translate"
          class="w-full border rounded-md px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-[var(--sned-orange)] focus:border-transparent"
          [ngClass]="{ 'border-red-500': isInvalid('email') }"
        />
        <p *ngIf="isInvalid('email')" class="text-red-500 text-xs mt-1">
          {{ 'contact.fields.email.error' | translate }}
        </p>
      </div>

      <!-- Sujet -->
      <div>
        <label for="subject" class="block text-sm font-medium text-slate-700 mb-1">
          {{ 'contact.fields.subject.label' | translate }}
        </label>
        <input
          id="subject"
          type="text"
          formControlName="subject"
          [placeholder]="'contact.fields.subject.placeholder' | translate"
          class="w-full border rounded-md px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-[var(--sned-orange)] focus:border-transparent"
          [ngClass]="{ 'border-red-500': isInvalid('subject') }"
        />
        <p *ngIf="isInvalid('subject')" class="text-red-500 text-xs mt-1">
          {{ 'contact.fields.subject.error' | translate }}
        </p>
      </div>

      <!-- Message -->
      <div>
        <label for="message" class="block text-sm font-medium text-slate-700 mb-1">
          {{ 'contact.fields.message.label' | translate }}
        </label>
        <textarea
          id="message"
          rows="5"
          formControlName="message"
          [placeholder]="'contact.fields.message.placeholder' | translate"
          class="w-full border rounded-md px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-[var(--sned-orange)] focus:border-transparent resize-none"
          [ngClass]="{ 'border-red-500': isInvalid('message') }"
        ></textarea>
        <p *ngIf="isInvalid('message')" class="text-red-500 text-xs mt-1">
          {{ 'contact.fields.message.error' | translate }}
        </p>
      </div>

      <!-- Bouton -->
      <div class="text-center">
        <button
          type="submit"
          class="bg-[var(--sned-orange)] hover:bg-orange-600 text-white font-medium px-6 py-2 rounded-md transition-colors"
        >
          {{ 'contact.submit' | translate }}
        </button>
      </div>

    </form>
  </div>
</section>
