<div
  id="partners"
  class="w-full"
  appScrollAnimation
  [animationType]="'fadeUp'"
>
  <div class="flex justify-between items-center mb-6"></div>

  <div >
    <div
      class="overflow-hidden transition-all duration-500 ease-in-out max-h-screen opacity-100"
    >
      <!-- <div class="partners-header">
        <h1>{{ 'partners.title' | translate }}</h1>
        <p>{{ 'partners.description' | translate:{ count: partners().length } }}</p>
        <h2>{{ 'partners.cartographic_title' | translate:{ count: partners().length } }}</h2>
        
      </div> -->

      <div class="partners-container">
        @for (partner of partners(); track $index) {
        <div class="partner-card">
          <img
            [src]="partner.logoUrl"
            [alt]="partner.name"
            class="partner-logo"
          />
          <div class="partner-tooltip">
            <h3>
              <b>{{ partner.name }}</b>
            </h3>
            <p>
              {{
                partner.partnerType === "NATIONAL"
                  ? ("partners.national_partner" | translate)
                  : ("partners.international_partner" | translate)
              }}
            </p>
          </div>
        </div>
        }
      </div>
    </div>
  </div>
</div>
